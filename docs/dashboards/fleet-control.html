<title>Fleet Control — Pete's AI Engines</title>
<style>
  :root {
    --bg: #F5F1E8;
    --surface: #FFFDF8;
    --surface-2: #EFE9DB;
    --surface-3: #E7DFCC;
    --border: #E2D9C6;
    --border-strong: #D2C6AC;
    --ink: #2A2620;
    --ink-soft: #6B6355;
    --ink-faint: #978D79;
    --gold: #B8893B;
    --gold-strong: #92671F;
    --gold-wash: #F0E6CF;
    --live: #4E7C4A;
    --warn: #B57F26;
    --alert: #B4472F;
    --live-wash: #E4EEDF;
    --warn-wash: #F3E9D2;
    --alert-wash: #F3DFD7;
    --shadow: 0 1px 2px rgba(42,38,32,.06), 0 8px 24px rgba(42,38,32,.05);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #15120C;
      --surface: #201C14;
      --surface-2: #29241A;
      --surface-3: #322C20;
      --border: #3A3324;
      --border-strong: #4A4230;
      --ink: #F1EAD9;
      --ink-soft: #B4A98F;
      --ink-faint: #857C68;
      --gold: #D8B25C;
      --gold-strong: #ECC978;
      --gold-wash: #2E2717;
      --live: #74B063;
      --warn: #E0B152;
      --alert: #E4744F;
      --live-wash: #212B1C;
      --warn-wash: #2E2814;
      --alert-wash: #2E1D16;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15120C;
    --surface: #201C14;
    --surface-2: #29241A;
    --surface-3: #322C20;
    --border: #3A3324;
    --border-strong: #4A4230;
    --ink: #F1EAD9;
    --ink-soft: #B4A98F;
    --ink-faint: #857C68;
    --gold: #D8B25C;
    --gold-strong: #ECC978;
    --gold-wash: #2E2717;
    --live: #74B063;
    --warn: #E0B152;
    --alert: #E4744F;
    --live-wash: #212B1C;
    --warn-wash: #2E2814;
    --alert-wash: #2E1D16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .mono { font-family: var(--mono); }

  .shell {
    display: grid;
    grid-template-columns: 268px minmax(0, 1fr);
    max-width: 1240px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ---------- RAIL ---------- */
  .rail {
    border-right: 1px solid var(--border);
    padding: 26px 18px 40px;
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow-y: auto;
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 4px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(150deg, var(--gold), var(--gold-strong));
    display: grid; place-items: center;
    color: #fff; font-size: 17px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  :root[data-theme="dark"] .brand-mark, :root:not([data-theme="light"]) .brand-mark { color: #1a1508; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-mark { color: #1a1508; } }
  .brand-name { font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
  .brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: .04em; text-transform: uppercase; }

  .rail-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 22px 10px 8px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 11px;
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; text-align: left; width: 100%;
    background: none; color: inherit; font-family: inherit; font-size: 13.5px;
    transition: background .14s, border-color .14s;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: var(--surface); border-color: var(--border-strong); box-shadow: var(--shadow); }
  .nav-glyph { font-size: 15px; width: 20px; text-align: center; }
  .nav-text { min-width: 0; }
  .nav-title { font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-cadence { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px var(--live-wash); }
  .dot.weekly { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-wash); }

  .rail-foot { margin-top: 26px; padding: 12px 10px 0; border-top: 1px solid var(--border); }
  .rail-foot .wall {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft);
    display: flex; gap: 7px; align-items: baseline;
  }
  .rail-foot .wall b { color: var(--gold-strong); }

  /* ---------- MAIN ---------- */
  .main { padding: 26px 34px 64px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  .topbar .clock { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); letter-spacing: .02em; }
  .theme-btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-soft);
    border-radius: 8px; padding: 6px 11px; cursor: pointer; font-family: var(--mono);
    font-size: 11px; letter-spacing: .03em; display: inline-flex; align-items: center; gap: 6px;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--gold); }

  .view { display: none; animation: fade .28s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view, .view.active { animation: none; } }

  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-strong); }
  h1 { font-size: 30px; letter-spacing: -.025em; margin: 6px 0 4px; text-wrap: balance; font-weight: 700; }
  .lede { color: var(--ink-soft); font-size: 15.5px; max-width: 62ch; margin: 0 0 4px; }

  .status-line { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 22px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono);
    font-size: 11px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border-strong);
    background: var(--surface); letter-spacing: .02em;
  }
  .pill.live { color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, var(--border)); background: var(--live-wash); }
  .pill.weekly { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); background: var(--warn-wash); }
  .pill .dot { width: 7px; height: 7px; box-shadow: none; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 24px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px 16px; box-shadow: var(--shadow); }
  .metric .mlabel { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .metric .mval { font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .metric .mnote { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .metric.accent .mval { color: var(--gold-strong); }

  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 12px; font-family: var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }

  .does { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .does li { display: grid; grid-template-columns: auto 1fr; gap: 11px; font-size: 14px; align-items: baseline; }
  .does li::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--gold); transform: translateY(-1px); }

  .cadence-list { display: flex; flex-direction: column; gap: 9px; }
  .cad { display: grid; grid-template-columns: 116px 1fr; gap: 12px; font-size: 13px; align-items: baseline; padding-bottom: 9px; border-bottom: 1px dashed var(--border); }
  .cad:last-child { border-bottom: 0; padding-bottom: 0; }
  .cad .when { font-family: var(--mono); font-size: 11.5px; color: var(--gold-strong); letter-spacing: .01em; }
  .cad .what { color: var(--ink-soft); }

  .pending { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .pending li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 13px; align-items: baseline; color: var(--ink-soft); }
  .pending li::before { content: "→"; color: var(--alert); font-family: var(--mono); font-size: 12px; }
  .pending.clear li::before { content: "✓"; color: var(--live); }

  .wallbox { background: var(--gold-wash); border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--border)); border-radius: 12px; padding: 13px 16px; font-size: 13px; color: var(--ink-soft); margin-top: 18px; }
  .wallbox b { color: var(--gold-strong); font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }

  /* quick-launch bar (overview) — open any engine dashboard in one click */
  .launch-panel { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); margin: 4px 0 24px; }
  .launch-head { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-strong); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .launch-head .glyph { font-size: 14px; }
  .launchbar { display: flex; flex-wrap: wrap; gap: 9px; }
  .launch { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
    cursor: pointer; font-family: inherit; transition: border-color .14s, transform .1s, background .14s; }
  .launch:hover { border-color: var(--gold); transform: translateY(-1px); background: var(--surface); }
  .launch .lg { font-size: 15px; }
  .launch .arr { font-family: var(--mono); color: var(--gold-strong); }
  .launch.digest { color: var(--ink-soft); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    transition: border-color .14s, transform .1s;
  }
  .btn:hover { border-color: var(--gold); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(150deg, var(--gold), var(--gold-strong)); color: #fff; border-color: transparent; }
  :root[data-theme="dark"] .btn.primary { color: #1a1508; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1a1508; } }
  .btn .arr { font-family: var(--mono); }
  .btn.disabled { opacity: .55; pointer-events: none; }
  .btn small { font-weight: 400; color: var(--ink-faint); }

  /* overview fleet cards */
  .fleet { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 6px; }
  .fcard { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 17px 18px; box-shadow: var(--shadow); color: inherit; transition: border-color .14s; }
  .fcard:hover { border-color: var(--border-strong); }
  .fcard-top { display: flex; align-items: center; justify-content: space-between; }
  .fcard-glyph { font-size: 20px; }
  .fcard h4 { margin: 12px 0 3px; font-size: 15.5px; letter-spacing: -.01em; }
  .fcard p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .fcard .fcad { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 11px; display: block; letter-spacing: .01em; }
  .fcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--border); }
  .fcard-open {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-size: 12px; font-weight: 600; color: var(--gold-strong); font-family: var(--mono);
    letter-spacing: .01em; padding: 3px 4px; border-radius: 6px;
  }
  .fcard-open:hover { text-decoration: underline; }
  .fcard-open.disabled { color: var(--ink-faint); font-weight: 400; }
  .fcard-panel { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); background: none; border: 0; padding: 3px 4px; cursor: pointer; letter-spacing: .02em; border-radius: 6px; }
  .fcard-panel:hover { color: var(--gold-strong); }

  .divider { height: 1px; background: var(--border); margin: 30px 0 24px; border: 0; }
  .sec-head { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 14px; }

  .countdown { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
  .countdown b { font-size: 25px; font-weight: 700; letter-spacing: -.02em; color: var(--gold-strong); }

  /* mobile */
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 18px 14px; }
    .rail-foot { display: none; }
    .rail-label { padding: 16px 10px 8px; }
    .nav { flex-direction: row; overflow-x: auto; gap: 8px; padding-bottom: 4px; }
    .nav-item { grid-template-columns: auto auto; flex: none; }
    .nav-item .nav-cadence { display: none; }
    .main { padding: 20px 18px 50px; }
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 25px; }
  }
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">◆</div>
      <div>
        <div class="brand-name">Fleet Control</div>
        <div class="brand-sub">1691 Inc · Ultradian</div>

</div>

<style>

</style>

/* chip filtering, delegated so it survives re-render */
document.addEventListener("click", ev => {
  const chip = ev.target.closest(".chip");
  if (!chip) return;
  const view = chip.closest(".view");
  view.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
  const f = chip.dataset.filter;
  view.querySelectorAll(".cgroup").forEach(g => {
    g.style.display = (f === "all" || g.dataset.cluster === f) ? "" : "none";
  });
});

/* ---------- selection ---------- */
function select(id) {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.target === id));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + id));
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* ---------- countdown + clock ---------- */
function tick() {
  const now = new Date();
  const days = Math.max(0, Math.ceil((LAUNCH - now) / 864e5));
  const cd = document.getElementById("cd-days");
  if (cd) cd.textContent = "T-" + days;
  const pill = document.getElementById("cd-pill");
  if (pill) pill.innerHTML = `<span class="dot weekly"></span>T-${days} to launch`;
  const clock = document.getElementById("clock");
  clock.textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" }).toUpperCase()
    + " · " + now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}
tick();
setInterval(tick, 30000);

  const isDark = cur ? cur === "dark" : prefersDark;
  root.setAttribute("data-theme", isDark ? "light" : "dark");
});
</script>
